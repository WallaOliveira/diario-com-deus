<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste - Diário com Deus</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background: transparent;">
    <div 
        class="min-h-screen relative overflow-hidden"
        style="
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #312e81 100%);
            min-height: 100vh;
        "
    >
        <!-- Conteúdo -->
        <div class="relative z-10 flex flex-col items-center justify-center min-h-screen p-4 text-white text-center">
            <h1 class="text-5xl md:text-6xl font-bold mb-4 drop-shadow-lg">
                Diário com Deus
            </h1>
            
            <p class="text-xl md:text-2xl text-white/90 mb-8 max-w-xl">
                "Lâmpada para os meus pés é a tua palavra e luz para o meu caminho"
            </p>

            <div class="space-y-4 w-full max-w-xs">
                <button class="block bg-yellow-400 text-blue-900 font-bold py-3.5 px-8 rounded-xl transition-all shadow-lg hover:shadow-xl hover:scale-105 w-full">
                    ⭐ Entrar Agora
                </button>
                
                <button class="block bg-transparent border-2 border-white text-white font-bold py-3.5 px-8 rounded-xl transition-all shadow-lg hover:shadow-xl hover:scale-105 w-full">
                    Criar Conta Gratuita
                </button>
            </div>
        </div>
    </div>
</body>
</html>
